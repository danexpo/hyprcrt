name: build

# Builds the plugin against Arch's current hyprland package on every push and weekly, and publishes the
# result so users do not need a compiler:
#   - every run uploads hyprcrt-<hyprland commit>.so as a workflow artifact
#   - pushes to main, the weekly run and manual runs add it to the rolling "prebuilt" release
#     (tools/crt-fetch reads that release), with its checksum in SHA256SUMS and the hyprcrt version it
#     was built from (manifest.json) in VERSIONS, one line per library; both lists carry a detached Ed25519
#     signature (.sig) by the release key in the HYPRCRT_SIGNING_KEY secret, whose public half is
#     release-key.pub in the tree and inline in the post-update hook: installers trust the lists only signed
#   - a v* tag creates a proper release with the same asset, checksum and version files
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # weekly: catch Hyprland package bumps
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plugin:
    name: Hyprland plugin (Arch, current hyprland package)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain and Hyprland headers
        run: |
          pacman -Syu --noconfirm --needed base-devel git pkgconf hyprland lua mesa github-cli jq python wget # the install test's hung-network cases
      - uses: actions/checkout@v4
      - name: Build
        run: make -C plugin all -j"$(nproc)" OPT="-O2"
      - name: Name the library after the Hyprland commit it was built against
        id: hash
        run: |
          commit=$(grep -m1 GIT_COMMIT_HASH /usr/include/hyprland/src/version.h | cut -d'"' -f2)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "hyprland package: $(pacman -Q hyprland) commit $commit"
          mkdir -p dist
          cp plugin/out/hyprcrt.so "dist/hyprcrt-$commit.so"
          (cd dist && sha256sum "hyprcrt-$commit.so" > "hyprcrt-$commit.so.sha256")
          version=$(jq -r .version manifest.json)
          echo "$version  hyprcrt-$commit.so" > "dist/hyprcrt-$commit.so.version"
          echo "hyprcrt version: $version"
      - name: The README's install on a clean HOME takes this library as a verified prebuilt
        run: tests/run-install-test.sh plugin/out/hyprcrt.so
      - uses: actions/upload-artifact@v4
        with:
          name: hyprcrt-plugin-so
          path: dist/

      # rolling "prebuilt" release: one asset per Hyprland commit, plus a merged SHA256SUMS and VERSIONS
      - name: Publish to the rolling prebuilt release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          HYPRCRT_SIGNING_KEY: ${{ secrets.HYPRCRT_SIGNING_KEY }}
        run: |
          sign() { # files: a detached Ed25519 signature beside each, by the release key
            [ -n "$HYPRCRT_SIGNING_KEY" ] || { echo "HYPRCRT_SIGNING_KEY secret is not set; unsigned lists are not published" >&2; exit 1; }
            (umask 077 && printf '%s\n' "$HYPRCRT_SIGNING_KEY" > "$RUNNER_TEMP/sign.pem")
            for f in "$@"; do openssl pkeyutl -sign -inkey "$RUNNER_TEMP/sign.pem" -rawin -in "$f" -out "$f.sig"; done
            rm -f "$RUNNER_TEMP/sign.pem"
            openssl pkeyutl -verify -pubin -inkey release-key.pub -rawin -in "$1" -sigfile "$1.sig"
          }
          git config --global --add safe.directory "$PWD"
          commit=${{ steps.hash.outputs.commit }}
          if ! gh release view prebuilt >/dev/null 2>&1; then
            gh release create prebuilt --title "Prebuilt plugin" --latest=false \
              --notes "Rolling release. Each hyprcrt-<commit>.so is built against the Hyprland commit in its name. hyprcrt install (tools/crt-fetch) picks the one matching your Hyprland and verifies it against SHA256SUMS."
          fi
          for f in SHA256SUMS:sha256 VERSIONS:version; do
            list=${f%%:*} ext=${f##*:}
            gh release download prebuilt --pattern "$list" --dir dist --clobber || true
            touch "dist/$list"
            grep -v " hyprcrt-$commit.so$" "dist/$list" > "dist/$list.new" || true
            cat "dist/hyprcrt-$commit.so.$ext" >> "dist/$list.new"
            sort -k2 "dist/$list.new" > "dist/$list"
          done
          sign dist/SHA256SUMS dist/VERSIONS
          gh release upload prebuilt "dist/hyprcrt-$commit.so" dist/SHA256SUMS dist/SHA256SUMS.sig dist/VERSIONS dist/VERSIONS.sig --clobber

      # tagged release: the same asset, checksum and version files attached to the tag
      - name: Publish the tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          HYPRCRT_SIGNING_KEY: ${{ secrets.HYPRCRT_SIGNING_KEY }}
        run: |
          sign() { # files: a detached Ed25519 signature beside each, by the release key
            [ -n "$HYPRCRT_SIGNING_KEY" ] || { echo "HYPRCRT_SIGNING_KEY secret is not set; unsigned lists are not published" >&2; exit 1; }
            (umask 077 && printf '%s\n' "$HYPRCRT_SIGNING_KEY" > "$RUNNER_TEMP/sign.pem")
            for f in "$@"; do openssl pkeyutl -sign -inkey "$RUNNER_TEMP/sign.pem" -rawin -in "$f" -out "$f.sig"; done
            rm -f "$RUNNER_TEMP/sign.pem"
            openssl pkeyutl -verify -pubin -inkey release-key.pub -rawin -in "$1" -sigfile "$1.sig"
          }
          git config --global --add safe.directory "$PWD"
          commit=${{ steps.hash.outputs.commit }}
          cp "dist/hyprcrt-$commit.so.sha256" dist/SHA256SUMS
          cp "dist/hyprcrt-$commit.so.version" dist/VERSIONS
          sign dist/SHA256SUMS dist/VERSIONS
          assets=("dist/hyprcrt-$commit.so" dist/SHA256SUMS dist/SHA256SUMS.sig dist/VERSIONS dist/VERSIONS.sig)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --title "hyprcrt $GITHUB_REF_NAME" --generate-notes || \
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber

  shaders:
    name: Shaders compile
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install glslang
        run: pacman -Syu --noconfirm --needed glslang gawk
      - uses: actions/checkout@v4
      - name: The four presets and the seven plugin passes through glslangValidator
        # no /dev/dri here, so the GPU compile is skipped; tests/shadergate fails if it has no checker at all
        run: tests/shadergate /tmp/gate

  scripts:
    name: Shell, Lua and JSON checks
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install checkers
        run: pacman -Syu --noconfirm --needed shellcheck lua jq python diffutils # tools/crt-presets uses cmp and diff
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning -e SC1091,SC2016 bin/hyprcrt tools/crt-build tools/crt-fetch omarchy-plugin/hooks/hyprcrt-rebuild tests/run-nested.sh tests/run-loader-test.sh tests/shadergate tests/run-cli-test.sh tests/lib-nested.sh tests/run-install-test.sh tests/presetcheck tools/crt-presets tests/run-damage-test.sh tests/run-capture-test.sh tests/uniformcheck
      - name: The preset tables in bin/hyprcrt and Look.hpp agree with presets/*.conf
        run: tests/presetcheck
      - name: Chain.cpp's uniform names agree with what each pass declares
        run: tests/uniformcheck
      - name: The CLI in a sandboxed HOME (what set refuses and stores)
        run: tests/run-cli-test.sh
      - name: Lua syntax
        run: for f in lua/loader.lua omarchy-plugin/bindings.lua tests/nested.lua tests/loader-test.lua; do luac -p "$f"; done
      - name: JSON and JSONC
        run: |
          jq -e '.schemaVersion == 1 and (.id | startswith("omarchy.") | not)' manifest.json
          python3 -c "import re,json; [json.loads(re.sub(r'^\s*//.*$','',open(f).read(),flags=re.M)) for f in ('omarchy-plugin/menu.jsonc',)]"

  omarchy-plugin:
    name: Omarchy plugin QML lint
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install qmllint
        run: pacman -Syu --noconfirm --needed qt6-declarative make
      - uses: actions/checkout@v4
      - name: Lint QML (a syntax error fails; the qs.* modules come from omarchy-shell, so their names are not resolved)
        run: make qml QMLLINT=/usr/lib/qt6/bin/qmllint
